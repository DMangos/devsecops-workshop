name: Pre-commit

# Run on every pull request targeting main.
on:
  pull_request:
    branches: [main]

jobs:
  # Runs the hooks from .pre-commit-config.yaml against the whole repo.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    # Read-only token: the job only inspects the code, never writes back.
    permissions:
      contents: read

    steps:
      # Fetch the repo so the hooks have files to check.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pre-commit is a Python tool, so it needs an interpreter available.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      # Runs `pre-commit run --all-files` and prints the diff for any hook
      # that rewrites a file, so the author can apply it locally.
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
